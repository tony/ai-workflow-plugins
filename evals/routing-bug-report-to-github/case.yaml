schema_version: "1.0"
name: routing-bug-report-to-github
description: >-
  A bug in an open-source repository goes to the issue tracker it lives in.
  With both plugins loaded, gh must win and ticket must stay quiet.
tags: [routing]

plugins: ["../../plugins/gh", "../../plugins/ticket"]

execution:
  prompt: |-
    Report this bug to the maintainers with a reproduction. It's in the open-source project example/widgets. Here's what I found:

    Running `widgets build --target=wasm` on version 2.4.1 with Node 20 throws:

    ```
    TypeError: Cannot read properties of undefined (reading 'target')
    ```

    I confirmed it happens every time on a clean checkout of v2.4.1. It works fine on v2.3.0. Looking at the source, `resolveTarget()` in `src/build.js` assumes `opts.target` is always set, but the wasm preset never populates it.
  max_turns: 15
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: create-issue-wins
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(gh:)?create-issue"'
    arm: both

  - name: ticket-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(ticket:)?(draft|rebuild)"'
    min: 0
    max: 0
    arm: both

  - name: names-the-target-repository
    type: regex
    target: last_message
    pattern: 'example/widgets'

  - name: drafts-a-summary-first-body
    type: regex
    target: last_message
    pattern: '^#{2,4} +Summary'
    flags: m

  - name: includes-reproduction-steps
    type: regex
    target: last_message
    pattern: '^#{2,4} +Reproduction'
    flags: m

  - name: claims-no-issue-was-filed
    type: regex
    target: last_message
    match: not_contains
    pattern: 'I (have )?(filed|created|opened) (the |this |an )?issue'
    flags: i
