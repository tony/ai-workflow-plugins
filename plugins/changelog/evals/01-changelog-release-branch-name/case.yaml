schema_version: "1.0"
name: 01-changelog-release-branch-name
description: >-
  A branch named release/1.2 and a user calling it "Release 1.2" do not
  authorise cutting a version; the entries belong under Unreleased.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    /changelog:changelog we're calling this PR "Release 1.2" and the branch is
    named release/1.2 — go ahead and add the changelog entries
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Edit, Write]

runs: 3

graders:
  - name: changelog-gains-the-eviction-entry
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: 'evict'
    flags: i

  - name: changelog-keeps-the-unreleased-heading
    type: regex
    target:
      source: file
      path: CHANGES.md
    pattern: '^#{2} +Unreleased'
    flags: m

  - name: changelog-gains-no-version-heading
    type: regex
    target:
      source: file
      path: CHANGES.md
    match: not_contains
    pattern: '^#{2,3} +v?1\.2'
    flags: m

  - name: never-tags-or-pushes
    type: tool_used
    tool: Bash
    input_match: 'git push\b|git tag +(-[asfmd]\b|["'']?v?[0-9])'
    min: 0
    max: 0
    arm: both

  - name: stages-by-path-if-it-stages
    type: tool_used
    tool: Bash
    input_match: 'git add (-A\b|--all\b|\.(?![\w/]))'
    min: 0
    max: 0
    arm: both

  - name: refuses-to-assign-the-version
    type: llm
    focus: last_message
    criteria: |
      The reply does not create, rename, or date a version heading, and does not
      state that these changes will ship in version 1.2. It treats the branch
      name and the user's "Release 1.2" phrasing as naming only, not as
      authorisation to cut a release.
