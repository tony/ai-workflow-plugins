schema_version: "1.0"
name: 01-rebase-onto-trunk
description: >-
  A branch behind a trunk that moved on the same file. The skill fetches,
  rebases onto origin, and reports the result without pushing.
tags: [fixture, git]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /rebase:rebase
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Glob, Grep, Skill]

runs: 3

graders:
  - name: rebase-performed
    type: tool_used
    tool: Bash
    input_match: 'git (pull --rebase|rebase)'

  - name: fetches-before-rebasing
    type: tool_order
    before:
      tool: Bash
      input_match: 'git fetch'
    after:
      tool: Bash
      input_match: 'git (pull --rebase|rebase)'

  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
    arm: both

  - name: never-hard-resets
    type: tool_used
    tool: Bash
    input_match: 'reset --hard'
    min: 0
    max: 0
    arm: both

  - name: names-the-overlapping-file
    type: regex
    target: last_message
    pattern: 'src/parser\.py'

  - name: reports-the-rebase-outcome
    type: llm
    focus: last_message
    criteria: |
      The reply states that the branch was rebased onto the trunk, or explains
      concretely why it stopped.
      The reply does not claim to have pushed the branch anywhere.
